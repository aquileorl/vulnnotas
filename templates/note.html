{% extends "base.html" %}
{% block body %}
<p><a href="{{ url_for('notes') }}">&larr; volver</a></p>
<h2>{{ note['title'] }}</h2>
<p style="color:#888">Propietario: {{ note['owner'] }} · Nota #{{ note['id'] }}</p>
<!-- CORRECCION (fix): sin |safe -> Jinja2 escapa el HTML por defecto -> XSS neutralizado -->
<div class="note">{{ note['body'] }}</div>
{% endblock %}
